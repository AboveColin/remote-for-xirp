name: apk

# Not triggered by tags, and not part of the normal release, because an Android wrapper
# cannot be built once for everyone. A Trusted Web Activity bakes in a single origin at
# build time and verifies it by fetching /.well-known/assetlinks.json from it — and every
# user's instance lives at a different, private address. So this builds an APK for one
# named origin, on request, signed with a keystore only you hold.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'HTTPS origin the app will open, e.g. https://xirp.example.com'
        required: true
      package_id:
        description: 'Android application id, e.g. dev.example.xirpremote'
        required: true
      app_name:
        description: 'Name shown under the icon'
        required: false
        default: 'Remote For Xirp'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # The project's own image has the JDK and Android command line tools already
    # installed, which is most of what makes this build slow and brittle otherwise.
    container:
      image: ghcr.io/googlechromelabs/bubblewrap:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs and the secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          case "${{ inputs.origin }}" in
            https://*) ;;
            *) echo "The origin must be https: a TWA cannot verify a plain-http origin." >&2; exit 1 ;;
          esac
          # Report the names of the secrets to add, not the names of the variables they
          # happen to be read into.
          missing=""
          [ -n "${KEYSTORE_B64:-}" ]      || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_PASSWORD:-}" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || missing="$missing ANDROID_KEY_ALIAS
          if [ -n "$missing" ]; then
            cat >&2 <<MSG
          Missing repository secrets:$missing

          These are yours to create; a signing key committed or generated by CI is a key
          anyone could sign with. On your machine:

            keytool -genkey -v -keystore android.keystore -alias upload \\
                    -keyalg RSA -keysize 2048 -validity 10000
            base64 -i android.keystore | pbcopy

          Then add, under Settings > Secrets and variables > Actions:
            ANDROID_KEYSTORE_BASE64   the value you just copied
            ANDROID_KEYSTORE_PASSWORD the store password you chose
            ANDROID_KEY_PASSWORD      the key password you chose
            ANDROID_KEY_ALIAS         upload
          MSG
            exit 1
          fi

      - name: Write the TWA manifest
        run: |
          set -eu
          mkdir -p build && cd build
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          # Written here rather than produced by `bubblewrap init`, which is prompt-driven
          # and has no non-interactive mode. Everything in it comes from the inputs or the
          # web manifest this repository already ships.
          cat > twa-manifest.json <<JSON
          {
            "packageId": "${{ inputs.package_id }}",
            "host": "$(echo '${{ inputs.origin }}' | sed -e 's|^https://||' -e 's|/.*$||')",
            "name": "${{ inputs.app_name }}",
            "launcherName": "Xirp",
            "display": "standalone",
            "themeColor": "#0e1014",
            "navigationColor": "#0e1014",
            "backgroundColor": "#0e1014",
            "startUrl": "/",
            "iconUrl": "${{ inputs.origin }}/icon-512.png",
            "maskableIconUrl": "${{ inputs.origin }}/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${{ inputs.origin }}/manifest.json",
            "fallbackType": "customtabs",
            "enableNotifications": true,
            "signingKey": { "path": "android.keystore", "alias": "${{ secrets.ANDROID_KEY_ALIAS }}" }
          }
          JSON
          cat twa-manifest.json

      - name: Build and sign
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          # update materialises the Android project from the manifest; skipPwaValidation
          # is required because the origin is usually private and cannot be fetched here.
          bubblewrap update --manifest=./twa-manifest.json --skipPwaValidation
          bubblewrap build --manifest=./twa-manifest.json --skipPwaValidation
          ls -la *.apk *.aab 2>/dev/null || true

      - name: Produce the asset links file the origin has to serve
        working-directory: build
        run: |
          bubblewrap fingerprint generateAssetLinks --manifest=./twa-manifest.json --output=assetlinks.json
          cat assetlinks.json

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-and-assetlinks
          # The keystore must not leave the runner.
          path: |
            build/*.apk
            build/*.aab
            build/assetlinks.json
          if-no-files-found: error

      - name: What to do with these
        run: |
          cat <<'MSG'
          Two files matter:

            app-release-signed.apk  install it on the phone
            assetlinks.json         copy to the machine running xirp-remote, at
                                    ~/Library/Application Support/xirp-remote/assetlinks.json

          xirp-remote serves that file at /.well-known/assetlinks.json, which is where
          Android looks to verify the app owns the origin. Without it the app still runs
          but shows a browser address bar.
          MSG
