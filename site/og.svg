<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png. Rasterised with sips, see make-og.sh in this directory.
       Kept in the repo so the card can be regenerated when the wording changes.
       No double hyphens in comments: the SVG parser rejects them.

       Light, like the app's default, because a social card is read in a feed next to
       other light cards. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef0f4" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4bf5" stop-opacity="0.16" />
      <stop offset="0.6" stop-color="#5b4bf5" stop-opacity="0.05" />
      <stop offset="1" stop-color="#5b4bf5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1010" cy="120" r="380" fill="url(#glow)" />

  <!-- The mark, on the rounded tile the app uses. -->
  <g transform="translate(88 66)">
    <rect width="96" height="96" rx="22" fill="#12141a" />
    <g transform="scale(1.5)">
      <circle cx="32" cy="44" r="6" fill="#8b7cff" />
      <g fill="none" stroke="#8b7cff" stroke-width="4" stroke-linecap="round">
        <path d="M20 34a16 16 0 0 1 24 0" opacity="0.85" />
        <path d="M14 25a26 26 0 0 1 36 0" opacity="0.55" />
        <path d="M8 16a36 36 0 0 1 48 0" opacity="0.3" />
      </g>
    </g>
  </g>

  <text x="88" y="290" font-family="Helvetica Neue, Helvetica, Arial" font-size="78" font-weight="bold" fill="#12141a" letter-spacing="-2.5">Remote For Xirp</text>
  <text x="88" y="350" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" fill="#5d6673">See and steer your coding agents from your phone.</text>

  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="24" fill="#12141a">
    <g transform="translate(88 424)">
      <rect x="0" y="-27" width="292" height="48" rx="24" fill="#ffffff" stroke="#dfe3e8" />
      <circle cx="27" cy="-3" r="5" fill="#128a4b" />
      <text x="46" y="4">Chat, transcript or tmux</text>
    </g>
    <g transform="translate(400 424)">
      <rect x="0" y="-27" width="238" height="48" rx="24" fill="#ffffff" stroke="#dfe3e8" />
      <circle cx="27" cy="-3" r="5" fill="#128a4b" />
      <text x="46" y="4">Review the diff</text>
    </g>
    <g transform="translate(658 424)">
      <rect x="0" y="-27" width="262" height="48" rx="24" fill="#ffffff" stroke="#dfe3e8" />
      <circle cx="27" cy="-3" r="5" fill="#128a4b" />
      <text x="46" y="4">Push when it's done</text>
    </g>
  </g>

  <text x="88" y="534" font-family="Menlo, monospace" font-size="24" fill="#5b4bf5">curl -fsSL remote-for-xirp.cdevries.dev/install.sh | sh</text>
  <text x="88" y="578" font-family="Helvetica Neue, Helvetica, Arial" font-size="21" fill="#8b939f">MIT licensed  ·  one Go binary  ·  runs on your own network  ·  unofficial</text>
</svg>
