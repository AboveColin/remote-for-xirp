<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png. Rasterised with sips, see make-og.sh in this directory.
       Kept in the repo so the card can be regenerated when the wording changes.
       No double hyphens in comments: the SVG parser rejects them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141b" />
      <stop offset="1" stop-color="#0b0d11" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#7c6cff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="980" cy="80" r="360" fill="url(#glow)" />

  <!-- The mark, at 2x the favicon's geometry. -->
  <g transform="translate(88 72) scale(1.75)">
    <circle cx="32" cy="44" r="6" fill="#7c6cff" />
    <g fill="none" stroke="#7c6cff" stroke-width="4" stroke-linecap="round">
      <path d="M20 34a16 16 0 0 1 24 0" opacity="0.85" />
      <path d="M14 25a26 26 0 0 1 36 0" opacity="0.55" />
      <path d="M8 16a36 36 0 0 1 48 0" opacity="0.3" />
    </g>
  </g>

  <text x="88" y="300" font-family="Helvetica Neue, Helvetica, Arial" font-size="76" font-weight="bold" fill="#f2f5f9" letter-spacing="-2">Remote For Xirp</text>
  <text x="88" y="360" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" fill="#9aa4b4">See and steer your coding agents from your phone.</text>

  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="24" fill="#c7cedb">
    <g transform="translate(88 430)">
      <rect x="0" y="-26" width="286" height="46" rx="23" fill="#1f242d" stroke="#262c36" />
      <circle cx="26" cy="-3" r="5" fill="#35c46a" />
      <text x="44" y="4">Chat, transcript or tmux</text>
    </g>
    <g transform="translate(392 430)">
      <rect x="0" y="-26" width="234" height="46" rx="23" fill="#1f242d" stroke="#262c36" />
      <circle cx="26" cy="-3" r="5" fill="#35c46a" />
      <text x="44" y="4">Review the diff</text>
    </g>
    <g transform="translate(644 430)">
      <rect x="0" y="-26" width="256" height="46" rx="23" fill="#1f242d" stroke="#262c36" />
      <circle cx="26" cy="-3" r="5" fill="#35c46a" />
      <text x="44" y="4">Push when it's done</text>
    </g>
  </g>

  <text x="88" y="536" font-family="Menlo, monospace" font-size="24" fill="#9384ff">curl -fsSL remote-for-xirp.cdevries.dev/install.sh | sh</text>
  <text x="88" y="580" font-family="Helvetica Neue, Helvetica, Arial" font-size="21" fill="#6f7987">MIT licensed  ·  one Go binary  ·  runs on your own network  ·  unofficial</text>
</svg>
